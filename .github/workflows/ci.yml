name: CI

on:
  push:
    branches: [main, master, debug]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# 与 hexsight 使用相同的仓库地址和 Secret 名称。
# REGISTRY 包含命名空间，不带 https://；留空可禁用推送。
env:
  REGISTRY: 'crpi-9jwlonaugv9hai08.cn-guangzhou.personal.cr.aliyuncs.com/snake-2001'
  BACKEND_IMAGE: tronenergy:latest

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies and project
        run: |
          python -m pip install --only-binary=coincurve -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check .

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/containers/Dockerfile
          load: true
          push: false
          tags: tronenergy:sha-${{ github.sha }}
          cache-from: type=gha,scope=tronenergy
          cache-to: type=gha,mode=max,scope=tronenergy
      # PR 和 CD 调用 CI 时不推送；独立 CI 的 push/手动运行才发布。
      - name: Prepare registry host
        if: env.REGISTRY != '' && github.workflow == 'CI' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: registry
        run: echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
      - name: Log in to image registry
        if: env.REGISTRY != '' && github.workflow == 'CI' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push application image
        if: env.REGISTRY != '' && github.workflow == 'CI' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          image="${REGISTRY}/${BACKEND_IMAGE}"
          docker tag "tronenergy:sha-${GITHUB_SHA}" "$image"
          docker push "$image"
