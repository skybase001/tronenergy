[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tronenergy"
version = "0.1.0"
description = "TRON Stake 2.0 resource rental services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<0.29",
  "psycopg[binary,pool]>=3.2,<4", "redis>=5,<9",
  "pydantic-settings>=2.6,<3", "tronpy==0.6.1", "protobuf>=5,<8",
  "pycryptodome==3.23.0"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[tool.setuptools]
packages = ["tronenergy_api", "tronenergy_rental", "tronenergy_chain", "tronenergy_signer", "tronenergy_observer", "tronenergy_domain", "tronenergy_storage", "tronenergy_observability"]

[tool.setuptools.package-dir]
tronenergy_api = "services/api/src/tronenergy_api"
tronenergy_rental = "services/rental/src/tronenergy_rental"
tronenergy_chain = "services/chain/src/tronenergy_chain"
tronenergy_signer = "services/signer/src/tronenergy_signer"
tronenergy_observer = "services/observer/src/tronenergy_observer"
tronenergy_domain = "packages/domain/src/tronenergy_domain"
tronenergy_storage = "packages/storage/src/tronenergy_storage"
tronenergy_observability = "packages/observability/src/tronenergy_observability"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database", "testnet: requires opt-in testnet credentials"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
